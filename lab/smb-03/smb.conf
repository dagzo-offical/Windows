[global]
   workgroup = WORKGROUP
   server string = ACME File Server
   security = user
   map to guest = Bad User
   guest account = nobody
   log level = 0
   server min protocol = SMB2
   smb ports = 445 139

[public]
   comment = Public Share
   path = /srv/public
   browseable = yes
   read only = yes
   guest ok = yes
