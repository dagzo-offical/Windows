[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tor-guard"
version = "1.0.0"
description = "Fail-closed system-wide Tor transparent-proxy kill switch for Linux workstations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tor Guard Contributors" }]
keywords = ["tor", "nftables", "kill-switch", "privacy", "security", "fail-closed"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: System :: Networking :: Firewalls",
]
dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.0,<15.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "black>=24.0",
    "bandit>=1.7",
    "types-PyYAML>=6.0",
]

[project.scripts]
tor-guard = "tor_guard.cli:app"

[project.urls]
Homepage = "https://github.com/dagzo-offical/windows"
Documentation = "https://github.com/dagzo-offical/windows/tree/main/tor-guard/docs"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tor_guard = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RUF", "S"]
ignore = [
    "S101",   # assert used - acceptable in tests
    "S404",   # subprocess import - required and centrally guarded, single audited gateway
    "UP042",  # accepted: `str, Enum` gives stable JSON values AND `Class.NAME` repr,
              #           which the CLI/tests rely on; StrEnum would change str() output.
    "SIM105", # accepted: explicit try/except/pass on best-effort chmod/unlink reads
              #           clearer than contextlib.suppress at these call sites.
    "RUF001", # accepted: user-facing strings are localized to Uzbek (Latin script);
              #           the letters "oʻ"/"gʻ" and typographic quotes use U+2018/U+2019
    "RUF002", # accepted: same Uzbek localization applies to docstrings.
    "RUF003", # accepted: same Uzbek localization applies to comments.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802", "N803"]
# Typer requires calls (typer.Option/Argument) as parameter defaults; B008 is
# the framework's idiom here, not a bug.
"src/tor_guard/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
files = ["src/tor_guard"]

[[tool.mypy.overrides]]
module = ["typer", "rich.*"]
ignore_missing_imports = true

# PyYAML ships no py.typed in the system package; types-PyYAML (a dev dependency)
# provides stubs in CI. Locally we tolerate the untyped import.
[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

# Typer's command decorators are untyped; under --strict this would flag every
# CLI command as "untyped decorator". The CLI is a thin presentation layer, so we
# relax only this one check for it (all logic lives in typed lower layers).
[[tool.mypy.overrides]]
module = ["tor_guard.cli"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "unit: fast isolated unit tests (no root, no network)",
    "integration: requires root, systemd, nftables (disposable VM only)",
    "leak: destructive leak tests (disposable VM only)",
]

[tool.coverage.run]
branch = true
source = ["tor_guard"]
omit = ["*/monitor/daemon.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.bandit]
exclude_dirs = ["tests", "vm-tests"]
# Documented, accepted findings:
#   B404 - importing `subprocess` is unavoidable for a firewall/Tor manager. All
#          use is funnelled through subprocess_runner.SubprocessRunner (no
#          shell=True, argv lists only, timeouts, absent-binary handling).
#   B603 - subprocess call without shell: this is exactly the safe form we want
#          (argv list, no shell). The single call site is audited.
skips = ["B404", "B603"]
