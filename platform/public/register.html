<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ro'yxatdan o'tish · CyberSecurity Platform</title><link rel="stylesheet" href="/app/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='84'%3E%F0%9F%9B%A1%EF%B8%8F%3C/text%3E%3C/svg%3E">
</head><body>
<div class="center"><div class="card authcard">
  <div class="brand" style="margin-bottom:6px"><span class="logo">🛡️</span>
    <span>CyberSecurity<small>Learning Platform</small></span></div>
  <h2 style="margin-top:14px">Ro'yxatdan o'tish</h2>
  <p class="muted small">Yangi hisob yarating. <b>Birinchi</b> foydalanuvchi administrator bo'ladi; keyingilar administrator tasdig'ini kutadi.</p>
  <label>Login <span class="muted">(3-24 belgi)</span></label><input id="u" autocomplete="username" autofocus>
  <label>Parol <span class="muted">(kamida 6 belgi)</span></label><input id="p" type="password" autocomplete="new-password">
  <button class="btn primary full" style="margin-top:18px" onclick="reg()">Ro'yxatdan o'tish</button>
  <div class="msg" id="m"></div>
  <p class="small muted" style="margin-top:14px">Hisobingiz bormi? <a href="/login">Kirish</a></p>
</div></div>
<script>
async function reg(){
  const m=document.getElementById('m'); m.textContent='';
  const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value})});
  const d=await r.json().catch(()=>({}));
  if(r.ok){ m.className='msg ok'; m.textContent=(d.message||'Ro\'yxatdan o\'tildi.')+' Kirish sahifasiga yo\'naltirilmoqda…';
    setTimeout(()=>location.href='/login',1800); }
  else { m.className='msg err'; m.textContent=d.error||'Xatolik.'; }
}
document.getElementById('p').addEventListener('keydown',e=>{if(e.key==='Enter')reg();});
</script>
</body></html>
