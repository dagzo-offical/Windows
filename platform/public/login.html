<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kirish · CyberSecurity Platform</title><link rel="stylesheet" href="/app/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='84'%3E%F0%9F%9B%A1%EF%B8%8F%3C/text%3E%3C/svg%3E">
</head><body>
<div class="center"><div class="card authcard">
  <div class="brand" style="margin-bottom:6px"><span class="logo">🛡️</span>
    <span>CyberSecurity<small>Learning Platform</small></span></div>
  <h2 style="margin-top:14px">Kirish</h2>
  <p class="muted small">Hisobingizga kiring.</p>
  <label>Login</label><input id="u" autocomplete="username" autofocus>
  <label>Parol</label><input id="p" type="password" autocomplete="current-password">
  <button class="btn primary full" style="margin-top:18px" onclick="login()">Kirish</button>
  <div class="msg" id="m"></div>
  <p class="small muted" style="margin-top:14px">Hisobingiz yo'qmi? <a href="/register">Ro'yxatdan o'tish</a></p>
</div></div>
<script>
async function login(){
  const m=document.getElementById('m'); m.textContent='';
  const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value})});
  const d=await r.json().catch(()=>({}));
  if(r.ok){location.href='/dashboard';} else {m.className='msg err';m.textContent=d.error||'Xatolik.';}
}
document.getElementById('p').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
</script>
</body></html>
