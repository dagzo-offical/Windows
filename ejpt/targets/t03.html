<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CloudStore</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:#f4f6fb;color:#1f2733}
.ipbadge{position:fixed;top:12px;right:14px;font-family:ui-monospace,monospace;font-size:12px;color:#7a8699;background:#fff;border:1px solid #e1e6ef;border-radius:8px;padding:5px 10px}
.bar{background:#fff;border-bottom:1px solid #e1e6ef;padding:10px 0}
.wrap{max-width:760px;margin:0 auto;padding:0 22px}
.urlbar{display:flex;gap:8px;align-items:center}
.urlbar .host{font-family:ui-monospace,monospace;font-size:13px;color:#7a8699}
.urlbar input{flex:1;padding:8px 11px;border:1px solid #d6dce8;border-radius:8px;font-family:ui-monospace,monospace;font-size:13px}
.urlbar button{padding:8px 13px;border:0;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}
h1{font-size:24px}.hero{background:linear-gradient(120deg,#2563eb,#7c3aed);color:#fff;border-radius:16px;padding:34px;margin:22px 0}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.prod{background:#fff;border:1px solid #e1e6ef;border-radius:12px;padding:16px}.prod .p{color:#2563eb;font-weight:700;margin-top:6px}
.view{background:#0f1626;color:#cfe;border-radius:12px;padding:18px;font-family:ui-monospace,monospace;font-size:13px;white-space:pre-wrap;margin:16px 0;min-height:40px}
.ok{color:#4ade80;word-break:break-all}.links{font-size:12px;color:#7a8699;margin-top:8px}.links a{color:#2563eb;cursor:pointer}
</style></head>
<body>
<div class="ipbadge">10.10.10.12 · :80</div>
<div class="bar"><div class="wrap urlbar">
  <span class="host">http://10.10.10.12</span>
  <input id="path" value="/" spellcheck="false">
  <button onclick="go()">Ochish</button>
</div></div>
<div class="wrap" id="page"></div>
<div class="wrap"><div class="view" id="view" style="display:none"></div></div>
<script>
var FC="LCQkMQkcUQ4dFhI8A0QUDV0aOgJaFQRQ";
function rv(b64,key){try{var s=atob(b64),o='';for(var i=0;i<s.length;i++)o+=String.fromCharCode(s.charCodeAt(i)^key.charCodeAt(i%key.length));return o.slice(0,5)==='EJPT{'?o:null;}catch(e){return null;}}
var HOME='<div class="hero"><h1>CloudStore</h1><p>Bulutli xizmatlar va litsenziyalar do\'koni.</p></div>'+
 '<div class="grid"><div class="prod">Backup Pro<div class="p">$29</div></div><div class="prod">CDN Plus<div class="p">$49</div></div><div class="prod">Vault<div class="p">$99</div></div></div>'+
 '<div class="links">Sayt xaritasi uchun: <a onclick="nav(\'/robots.txt\')">/robots.txt</a></div>';
function nav(p){document.getElementById('path').value=p;go();}
function go(){
  var raw=document.getElementById('path').value.trim();
  var page=document.getElementById('page'), view=document.getElementById('view');
  var norm=raw.replace(/^\/+|\/+$/g,'').toLowerCase();
  view.style.display='none'; page.innerHTML='';
  if(norm===''||norm==='index.html'){page.innerHTML=HOME;return;}
  if(norm==='robots.txt'){view.style.display='block';view.textContent="User-agent: *\nDisallow: /admin/\nDisallow: /internal-backup/\n# maintenance pages, do not index";return;}
  var f=rv(FC,norm);
  if(f){view.style.display='block';view.innerHTML='<span class="ok">[200 OK] '+norm+'/db_dump.txt\n\nFlag: <b>'+f+'</b></span>';return;}
  view.style.display='block';view.textContent="404 Not Found — "+raw;
}
document.addEventListener('DOMContentLoaded',function(){document.getElementById('page').innerHTML=HOME;});
</script>
</body></html>
